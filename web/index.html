<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="e5gvwr9kAPGzJjWIF4CEhq">
<head data-page-node-id="E1aswOhoIrzrdQpiEMiBdP">
<meta charset="UTF-8" data-page-node-id="8fxeO276CwsC6r33NxAlWU">
<title>学生成绩看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f7fa; color: #1f2937; padding: 32px 20px; line-height: 1.6;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }

  /* 顶部状态条：告诉使用者当前是"能改"还是"只能看" */
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; padding: 5px 12px; border-radius: 20px; margin-bottom: 20px;
  }
  .status.live { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .status.readonly { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* 页面版本标记：刷新后能一眼看出浏览器拿到的是不是最新页面，不受缓存欺骗 */
  .build-tag { font-size: 11px; color: #b0b7c3; margin-left: 10px; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .card {
    background: #fff; border-radius: 10px; padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #eef0f4;
  }
  .card .label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 600; color: #111827; }
  .card .value small { font-size: 13px; font-weight: 400; color: #6b7280; }

  .panel {
    background: #fff; border-radius: 10px; padding: 22px 24px; margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #eef0f4;
    /* 明细表加了操作按钮后列变多，窄屏时允许横向滚动，别把布局撑破 */
    overflow-x: auto;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #374151; }
  .panel .hint { font-size: 12px; color: #9ca3af; margin-bottom: 18px; }

  /* 添加学生表单 */
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .form-row input {
    border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 12px;
    font-size: 13px; font-family: inherit; width: 110px; color: #111827;
  }
  .form-row input:focus { outline: none; border-color: #93c5fd; box-shadow: 0 0 0 3px #eff6ff; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px;
    font-family: inherit; cursor: pointer; transition: all .15s ease;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-mini {
    background: #f3f4f6; color: #4b5563; padding: 4px 10px; font-size: 12px;
    border-radius: 6px; border: none; cursor: pointer; font-family: inherit; margin-right: 4px;
  }
  .btn-mini:hover { background: #e5e7eb; }
  .btn-mini.danger:hover { background: #fee2e2; color: #b91c1c; }

  /* 前十榜 */
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .board-card {
    position: relative; background: #fafbfc; border: 1px solid #eef0f4;
    border-radius: 10px; padding: 18px 10px 14px; text-align: center;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .board-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.07); }
  .board-rank { position: absolute; top: 8px; left: 10px; font-size: 12px; font-weight: 700; color: #9ca3af; }
  .board-ava { display: flex; justify-content: center; margin: 6px 0 10px; }
  .board-name { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 2px; }
  .board-id { font-size: 11px; color: #9ca3af; margin-bottom: 8px; }
  .board-avg { font-size: 20px; font-weight: 700; color: #2563eb; font-variant-numeric: tabular-nums; }
  .board-avg small { font-size: 11px; font-weight: 400; color: #9ca3af; margin-left: 2px; }

  /* 科目切换 */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    border: 1px solid #e5e7eb; background: #fff; color: #4b5563;
    padding: 6px 16px; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .tab:hover { background: #f9fafb; border-color: #d1d5db; }
  .tab.active { background: #2563eb; border-color: #2563eb; color: #fff; }

  /* 单科排名行 */
  .sub-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .sub-rank-no { width: 24px; font-size: 12px; color: #9ca3af; text-align: right; }
  .sub-name { width: 66px; font-size: 13px; color: #374151; }
  .sub-track { flex: 1; height: 16px; background: #f3f4f6; border-radius: 4px; overflow: hidden; }
  .sub-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #93c5fd, #3b82f6); }
  .sub-score {
    width: 40px; text-align: right; font-size: 13px; font-weight: 600;
    color: #111827; font-variant-numeric: tabular-nums;
  }

  /* 等级分布 */
  .dist-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .dist-label { width: 96px; font-size: 13px; color: #374151; text-align: right; flex-shrink: 0; }
  .dist-track { flex: 1; height: 20px; background: #f3f4f6; border-radius: 5px; overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 5px; min-width: 2px; transition: width .5s ease; }
  .dist-fill.g0 { background: linear-gradient(90deg, #6ee7b7, #10b981); }
  .dist-fill.g1 { background: linear-gradient(90deg, #93c5fd, #3b82f6); }
  .dist-fill.g2 { background: linear-gradient(90deg, #a5b4fc, #6366f1); }
  .dist-fill.g3 { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
  .dist-fill.g4 { background: linear-gradient(90deg, #fca5a5, #ef4444); }
  .dist-val { width: 92px; font-size: 12px; color: #6b7280; flex-shrink: 0; }

  /* 明细表 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 10px 12px; font-weight: 500; font-size: 12px;
    color: #6b7280; border-bottom: 1px solid #e5e7eb; background: #fafbfc;
  }
  th:first-child { border-radius: 6px 0 0 0; }
  th:last-child { border-radius: 0 6px 0 0; }
  td { padding: 11px 12px; border-bottom: 1px solid #f1f3f6; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  .num { font-variant-numeric: tabular-nums; }

  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 6px; font-size: 12px;
    background: #f3f4f6; color: #4b5563;
  }
  .r1 { background: #fef3c7; color: #92400e; font-weight: 600; }
  .r2 { background: #e5e7eb; color: #374151; font-weight: 600; }
  .r3 { background: #fed7aa; color: #9a3412; font-weight: 600; }

  /* 条形图 */
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-name { width: 70px; font-size: 13px; color: #374151; flex-shrink: 0; text-align: right; }
  .bar-track { flex: 1; height: 22px; background: #f3f4f6; border-radius: 5px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, #60a5fa, #3b82f6);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px; color: #fff; font-size: 11px; font-weight: 500;
    transition: width .6s ease;
  }

  /* 头像 */
  .avatar-wrap { position: relative; display: inline-block; }
  .avatar-fb {
    position: absolute; inset: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 500;
  }
  img.avatar {
    position: absolute; inset: 0; border-radius: 50%;
    object-fit: cover; opacity: 0; border: 1px solid #e5e7eb; background: #fff;
  }
  img.avatar.ok { opacity: 1; }

  .empty { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: 14px; }
  .empty code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; color: #4b5563; }
  .footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 8px; }

  @media (max-width: 860px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .board { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body data-page-node-id="E9qTEY5Qi8pQsX1gHy9GQi">
<div class="wrap" data-page-node-id="OzSHWaXmSBCDXASSntwgs1">
  <h1 data-page-node-id="ngWPxnFrjM0jcFgwCWG4Ul">学生成绩看板</h1>
  <p class="sub" data-page-node-id="rbQAEdfEjuYhYTfgtSgqvJ">数据来源：C++ 程序导出的 data.js，或本地后端的实时数据</p>
  <div id="status" data-page-node-id="QS9AxDFvhHGY53ewkCTD6v"></div>
  <div id="content" data-page-node-id="VnBLZZw3SbQqAlZoBsHdMB"></div>
</div>

<!-- 隐藏的文件选择框：点表格里的"照片"按钮时，由 JS 打开它 -->
<input type="file" id="photo-file" accept="image/jpeg,image/png" style="display:none">

<!-- 静态模式下的数据来源；起了后端时不会用到它 -->
<script src="data.js"></script>
<script>
(function () {
  var box = document.getElementById('content');
  var statusBox = document.getElementById('status');

  var LIST = [];       // 当前要展示的学生
  var SUBS = [];       // 科目名
  var apiMode = false; // true = 连上了后端，可以增删改

  // ---------- 照片上传 ----------
  var photoInput = document.getElementById('photo-file');
  var photoTargetId = null;   // 当前要给哪个学生传照片

  photoInput.addEventListener('change', function () {
    if (!photoInput.files || !photoInput.files.length) return;

    var file = photoInput.files[0];
    if (!/^image\/(jpeg|png)$/.test(file.type)) {
      alert('只支持 jpg 或 png 图片');
      return;
    }
    if (file.size > 3 * 1024 * 1024) {
      alert('图片不能超过 3MB，先压缩一下再传');
      return;
    }

    // 直接把文件的二进制当请求体发过去，服务端按 Content-Type 判断格式
    fetch('/api/photos/' + encodeURIComponent(photoTargetId), {
      method: 'POST',
      headers: { 'Content-Type': file.type },
      body: file
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || ('上传失败 ' + r.status));
        return d;
      });
    }).then(function () {
      CACHE_VER = Date.now();   // 地址加时间戳，浏览器才会重新拉新图
      reload();
    }).catch(function (e) {
      alert('上传失败：' + e.message);
    });
  });

  // ---------- 基础计算 ----------
  function totalOf(s) {
    var t = 0;
    for (var i = 0; i < s.scores.length; i++) t += s.scores[i];
    return t;
  }
  function avgOf(s) { return totalOf(s) / s.scores.length; }
  function fix1(x) { return x.toFixed(1); }

  // ---------- 头像 ----------
  var COLORS = ['#93c5fd', '#fca5a5', '#86efac', '#fcd34d', '#c4b5fd', '#f9a8d4'];
  function colorOf(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 997;
    return COLORS[h % COLORS.length];
  }

  // 上传新照片后要让浏览器重新拉图，否则它会一直显示缓存里的旧照片。
  // 做法是在图片地址后面加个 ?v=时间戳，地址变了浏览器就当成新文件。
  var CACHE_VER = 0;
  function photoUrl(id, ext) {
    return 'photos/' + id + ext + (CACHE_VER ? '?v=' + CACHE_VER : '');
  }

  // 生成头像：优先 photos/学号.jpg，其次 .png，都没有就显示姓氏首字
  // 注意不写内联 onload/onerror，改由 bindAvatars 统一绑定（有些预览环境会过滤内联事件）
  function avatarHtml(id, name, size) {
    var fs = Math.round(size * 0.42);
    return '<div class="avatar-wrap" style="width:' + size + 'px;height:' + size + 'px">' +
      '<div class="avatar-fb" style="background:' + colorOf(id) + ';font-size:' + fs + 'px">' +
        name.charAt(0) +
      '</div>' +
      '<img class="avatar" data-id="' + id + '"' +
        ' style="width:' + size + 'px;height:' + size + 'px"' +
        ' src="' + photoUrl(id, '.jpg') + '" alt="">' +
      '</div>';
  }

  function bindAvatars(root) {
    var imgs = root.querySelectorAll('img.avatar');
    for (var k = 0; k < imgs.length; k++) {
      (function (img) {
        var id = img.getAttribute('data-id');
        var retried = false;
        img.addEventListener('load', function () { img.classList.add('ok'); });
        img.addEventListener('error', function () {
          if (!retried) { retried = true; img.src = photoUrl(id, '.png'); }
          else if (img.parentNode) img.parentNode.removeChild(img);
        });
        if (img.complete && img.naturalWidth > 0) img.classList.add('ok');
      })(imgs[k]);
    }
  }

  // ---------- 整页渲染 ----------
  function render() {
    var N = SUBS.length;
    var ranked = LIST.slice().sort(function (a, b) { return avgOf(b) - avgOf(a); });

    var classAvg = 0, topScore = -1, passCount = 0;
    LIST.forEach(function (s) {
      classAvg += avgOf(s);
      if (totalOf(s) > topScore) topScore = totalOf(s);
      if (avgOf(s) >= 60) passCount++;
    });
    classAvg = LIST.length ? classAvg / LIST.length : 0;
    var passRate = LIST.length ? passCount / LIST.length * 100 : 0;

    var html = '';

    // 有后端时，最上面给一个添加表单
    if (apiMode) {
      html += '<div class="panel"><h2>添加学生</h2>' +
        '<p class="hint">提交后会立刻写入 students.txt，C++ 程序也能读到</p>' +
        '<form id="add-form" class="form-row">' +
        '<input id="f-id" placeholder="学号" required maxlength="20">' +
        '<input id="f-name" placeholder="姓名" required maxlength="20">';
      for (var i = 0; i < N; i++) {
        html += '<input id="f-s' + i + '" placeholder="' + SUBS[i] +
          '" type="number" min="0" max="100" step="0.5" required>';
      }
      html += '<button class="btn btn-primary" type="submit">添加</button>' +
        '</form></div>';
    }

    // 概览卡片
    html += '<div class="cards">' +
      '<div class="card"><div class="label">学生人数</div><div class="value">' + LIST.length + ' <small>人</small></div></div>' +
      '<div class="card"><div class="label">班级平均分</div><div class="value">' + fix1(classAvg) + '</div></div>' +
      '<div class="card"><div class="label">最高总分</div><div class="value">' + topScore + '</div></div>' +
      '<div class="card"><div class="label">及格率</div><div class="value">' + fix1(passRate) + '<small>%</small></div></div>' +
      '</div>';

    if (!LIST.length) {
      html += '<div class="panel"><div class="empty">' +
        (apiMode
          ? '还没有学生，用上面的表单添加第一个。'
          : '还没有数据。运行 C++ 程序导出，或启动后端服务。') +
        '</div></div>';
      box.innerHTML = html;
      bindForm();
      return;
    }

    // 前十榜
    var topN = ranked.slice(0, 10);
    html += '<div class="panel"><h2>成绩前十榜</h2>' +
      '<p class="hint">共 ' + topN.length + ' 人上榜（最多显示 10 名）</p><div class="board">';
    topN.forEach(function (s, i) {
      html += '<div class="board-card">' +
        '<div class="board-rank">第 ' + (i + 1) + ' 名</div>' +
        '<div class="board-ava">' + avatarHtml(s.id, s.name, 64) + '</div>' +
        '<div class="board-name">' + s.name + '</div>' +
        '<div class="board-id">' + s.id + '</div>' +
        '<div class="board-avg">' + fix1(avgOf(s)) + '<small>分</small></div>' +
        '</div>';
    });
    html += '</div></div>';

    // 单科排名
    html += '<div class="panel"><h2>单科排名</h2>' +
      '<p class="hint">点上面的科目切换，看这一科谁最高</p><div class="tabs" id="sub-tabs">';
    SUBS.forEach(function (nm, i) {
      html += '<button class="tab' + (i === 0 ? ' active' : '') + '" data-sub="' + i + '">' + nm + '</button>';
    });
    html += '</div><div id="sub-rank"></div></div>';

    // 等级分布
    var GRADE_LABELS = ['优秀 ≥90', '良好 80-89', '中等 70-79', '及格 60-69', '不及格 <60'];
    var buckets = [0, 0, 0, 0, 0];
    LIST.forEach(function (s) {
      var a = avgOf(s);
      if (a >= 90) buckets[0]++;
      else if (a >= 80) buckets[1]++;
      else if (a >= 70) buckets[2]++;
      else if (a >= 60) buckets[3]++;
      else buckets[4]++;
    });
    html += '<div class="panel"><h2>等级分布</h2>' +
      '<p class="hint">按平均分划分，条形长度对应人数占比</p>';
    for (var g = 0; g < 5; g++) {
      var pct = LIST.length ? buckets[g] / LIST.length * 100 : 0;
      html += '<div class="dist-row">' +
        '<div class="dist-label">' + GRADE_LABELS[g] + '</div>' +
        '<div class="dist-track"><div class="dist-fill g' + g + '" style="width:' + pct + '%"></div></div>' +
        '<div class="dist-val">' + buckets[g] + ' 人 · ' + fix1(pct) + '%</div>' +
        '</div>';
    }
    html += '</div>';

    // 明细表
    html += '<div class="panel"><h2>成绩明细（按平均分排序）</h2>' +
      '<p class="hint">' + (apiMode
        ? '点每行末尾的「照片」按钮可直接选图上传（jpg/png，≤3MB）'
        : '照片放在 web/photos/ 文件夹，文件名用学号（如 2026001.jpg）') + '</p>' +
      '<table><thead><tr>' +
      '<th style="width:56px">名次</th><th style="width:52px">照片</th><th>学号</th><th>姓名</th>';
    SUBS.forEach(function (nm) { html += '<th class="num">' + nm + '</th>'; });
    html += '<th class="num">总分</th><th class="num">平均分</th>';
    if (apiMode) html += '<th style="width:172px">操作</th>';
    html += '</tr></thead><tbody>';

    ranked.forEach(function (s, i) {
      var cls = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
      html += '<tr>' +
        '<td><span class="rank-badge ' + cls + '">' + (i + 1) + '</span></td>' +
        '<td>' + avatarHtml(s.id, s.name, 34) + '</td>' +
        '<td>' + s.id + '</td><td>' + s.name + '</td>';
      s.scores.forEach(function (v) { html += '<td class="num">' + v + '</td>'; });
      html += '<td class="num">' + totalOf(s) + '</td>' +
        '<td class="num">' + fix1(avgOf(s)) + '</td>';
      if (apiMode) {
        html += '<td style="white-space:nowrap">' +
          '<button class="btn-mini" data-act="photo" data-id="' + s.id + '">照片</button>' +
          '<button class="btn-mini" data-act="edit" data-id="' + s.id + '">编辑</button>' +
          '<button class="btn-mini danger" data-act="del" data-id="' + s.id + '">删除</button>' +
          '</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    // 平均分对比
    html += '<div class="panel"><h2>平均分对比</h2><div style="margin-top:14px">';
    var maxAvg = avgOf(ranked[0]);
    ranked.forEach(function (s) {
      var w = maxAvg > 0 ? avgOf(s) / maxAvg * 100 : 0;
      html += '<div class="bar-row">' +
        '<div class="bar-name">' + s.name + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%">' + fix1(avgOf(s)) + '</div></div>' +
        '</div>';
    });
    html += '</div></div>';

    html += '<p class="footer">共 ' + LIST.length + ' 名学生 · ' + N + ' 门科目</p>';

    box.innerHTML = html;
    bindAvatars(box);
    setupTabs();
    bindForm();
  }

  // ---------- 单科排名切换 ----------
  function buildSubRank(sub) {
    var sorted = LIST.slice().sort(function (a, b) { return b.scores[sub] - a.scores[sub]; });
    var out = '';
    sorted.forEach(function (s, i) {
      var w = Math.max(0, Math.min(100, s.scores[sub]));   // 以 100 分为基准，方便跨科目比较
      out += '<div class="sub-row">' +
        '<div class="sub-rank-no">' + (i + 1) + '</div>' +
        avatarHtml(s.id, s.name, 28) +
        '<div class="sub-name">' + s.name + '</div>' +
        '<div class="sub-track"><div class="sub-fill" style="width:' + w + '%"></div></div>' +
        '<div class="sub-score">' + s.scores[sub] + '</div>' +
        '</div>';
    });
    return out;
  }

  function setupTabs() {
    var subBox = document.getElementById('sub-rank');
    var tabs = box.querySelectorAll('#sub-tabs .tab');
    if (!subBox || !tabs.length) return;

    function showSub(idx) {
      subBox.innerHTML = buildSubRank(idx);
      for (var t = 0; t < tabs.length; t++) {
        if (t === idx) tabs[t].classList.add('active');
        else tabs[t].classList.remove('active');
      }
      bindAvatars(subBox);
    }

    for (var t = 0; t < tabs.length; t++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          showSub(parseInt(btn.getAttribute('data-sub'), 10));
        });
      })(tabs[t]);
    }
    showSub(0);
  }

  // ---------- 与后端交互 ----------
  function api(method, url, body) {
    var opt = { method: method, headers: {} };
    if (body) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    }
    return fetch(url, opt).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || ('请求失败 ' + r.status));
        return d;
      });
    });
  }

  function reload() {
    if (!apiMode) return;
    api('GET', '/api/students').then(function (d) {
      LIST = d.students;
      SUBS = d.subjects;
      render();
    }).catch(function (e) { alert('刷新失败：' + e.message); });
  }

  function bindForm() {
    var form = document.getElementById('add-form');
    if (!form) return;
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var scores = [];
      for (var i = 0; i < SUBS.length; i++) {
        var el = document.getElementById('f-s' + i);
        scores.push(parseFloat(el.value));
      }
      api('POST', '/api/students', {
        id: document.getElementById('f-id').value.trim(),
        name: document.getElementById('f-name').value.trim(),
        scores: scores
      }).then(reload).catch(function (e) { alert(e.message); });
    });
  }

  // 表格里的"照片""编辑""删除"用事件委托：只绑一次，点击时再看点到了哪个按钮
  box.addEventListener('click', function (ev) {
    if (!apiMode) return;
    var btn = ev.target.closest ? ev.target.closest('button[data-act]') : null;
    if (!btn) return;

    var id = btn.getAttribute('data-id');
    var stu = null;
    for (var i = 0; i < LIST.length; i++) {
      if (LIST[i].id === id) { stu = LIST[i]; break; }
    }
    if (!stu) return;

    var act = btn.getAttribute('data-act');

    // 上传照片：记下是谁，然后打开隐藏的文件选择框
    if (act === 'photo') {
      photoTargetId = id;
      photoInput.value = '';        // 清空，保证同一个文件再选一次也能触发 change
      photoInput.click();
      return;
    }

    if (act === 'del') {
      if (!confirm('确定删除 ' + stu.name + '（' + stu.id + '）吗？会写入文件。')) return;
      api('DELETE', '/api/students/' + encodeURIComponent(id))
        .then(reload)
        .catch(function (e) { alert(e.message); });
      return;
    }

    // 编辑：依次问姓名和各科成绩，留空表示不改
    var newName = prompt('姓名（留空表示不改）', stu.name);
    if (newName === null) return;

    var newScores = [];
    for (var j = 0; j < SUBS.length; j++) {
      var v = prompt(SUBS[j] + '成绩（留空表示不改）', stu.scores[j]);
      if (v === null) return;
      newScores.push(v.trim() === '' ? stu.scores[j] : parseFloat(v));
    }

    var body = { scores: newScores };
    if (newName.trim() !== '') body.name = newName.trim();

    api('PUT', '/api/students/' + encodeURIComponent(id), body)
      .then(reload)
      .catch(function (e) { alert(e.message); });
  });

  function setStatus(live) {
    statusBox.innerHTML = (live
      ? '<span class="status live"><span class="dot"></span>已连接后端 · 数据可实时读写</span>'
      : '<span class="status readonly"><span class="dot"></span>静态数据 · 只读（启动后端后可编辑）</span>') +
      '<span class="build-tag">页面版本 2026-10-24b · 含照片上传</span>';
  }

  // ---------- 启动：先试后端，失败就退回静态数据 ----------
  fetch('/api/students', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('没有接口');
      return r.json();
    })
    .then(function (d) {
      apiMode = true;
      LIST = d.students;
      SUBS = d.subjects;
      setStatus(true);
      render();
    })
    .catch(function () {
      apiMode = false;
      setStatus(false);
      if (typeof STUDENTS !== 'undefined' && STUDENTS.length) {
        LIST = STUDENTS;
        SUBS = SUBJECTS;
        render();
      } else {
        box.innerHTML = '<div class="panel"><div class="empty">' +
          '没有数据。<br><br>启动后端：双击 <code>server/启动服务.bat</code>，' +
          '然后访问 <code>http://localhost:8000</code>' +
          '</div></div>';
      }
    });
})();
</script>
</body>
</html>
