<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="5Ubk0qHrRaVRz1tFW5yHGu">
<head data-page-node-id="g8vtrKBM5phifJDTsZkLk4">
<meta charset="UTF-8" data-page-node-id="wjRJfPRdLFKAVtXDgGEDtF">
<title>学生成绩看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f5f7fa;
    color: #1f2937;
    padding: 32px 20px;
    line-height: 1.6;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 24px; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .card {
    background: #fff; border-radius: 10px; padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #eef0f4;
  }
  .card .label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 600; color: #111827; }
  .card .value small { font-size: 13px; font-weight: 400; color: #6b7280; }

  .panel {
    background: #fff; border-radius: 10px; padding: 22px 24px; margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #eef0f4;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #374151; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 10px 12px; font-weight: 500; font-size: 12px;
    color: #6b7280; border-bottom: 1px solid #e5e7eb; background: #fafbfc;
  }
  th:first-child { border-radius: 6px 0 0 0; }
  th:last-child { border-radius: 0 6px 0 0; }
  td { padding: 11px 12px; border-bottom: 1px solid #f1f3f6; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  .num { font-variant-numeric: tabular-nums; }

  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 6px; font-size: 12px;
    background: #f3f4f6; color: #4b5563;
  }
  .r1 { background: #fef3c7; color: #92400e; font-weight: 600; }
  .r2 { background: #e5e7eb; color: #374151; font-weight: 600; }
  .r3 { background: #fed7aa; color: #9a3412; font-weight: 600; }

  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-name { width: 70px; font-size: 13px; color: #374151; flex-shrink: 0; text-align: right; }
  .bar-track { flex: 1; height: 22px; background: #f3f4f6; border-radius: 5px; overflow: hidden; }
  .bar-fill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, #60a5fa, #3b82f6);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px; color: #fff; font-size: 11px; font-weight: 500;
    transition: width .6s ease;
  }

  .empty { text-align: center; padding: 40px 20px; color: #9ca3af; font-size: 14px; }
  .empty code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; color: #4b5563; }
  .footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 8px; }
</style>

<body data-page-node-id="zXx4Za7ILUBEaVBbSHVTRk">
<div class="wrap" data-page-node-id="LnRoBgCCBgnRnHCjd99afJ">
  <h1 data-page-node-id="d4uPXlBXBC2EQGh8bM9M8V">学生成绩看板</h1>
  <p class="sub" data-page-node-id="9FgcLKiVNT8g6wMH5xKkTp">数据来源：C++ 程序导出的 data.js</p>

  <div id="content" data-page-node-id="1Mdiq9CfAjP338EzzRAiQG"></div>
</div>

<!-- 这一行就是"网页读取 C++ 数据"的关键 -->
<script src="data.js"></script>
<script>
(function () {
  var box = document.getElementById('content');

  // 没有 data.js 或里面是空数组时的提示
  if (typeof STUDENTS === 'undefined' || STUDENTS.length === 0) {
    box.innerHTML =
      '<div class="panel"><div class="empty">' +
      '还没有数据。<br><br>' +
      '打开 <code>run.bat</code> → 选 <code>1</code> 添加几个学生 → 选 <code>4</code> 导出，<br>' +
      '然后刷新本页即可看到图表。' +
      '</div></div>';
    return;
  }

  // ---------- 计算 ----------
  var N = SUBJECTS.length;

  function totalOf(s) {
    var t = 0;
    for (var i = 0; i < N; i++) t += s.scores[i];
    return t;
  }
  function avgOf(s) { return totalOf(s) / N; }

  // 按平均分从高到低排
  var ranked = STUDENTS.slice().sort(function (a, b) { return avgOf(b) - avgOf(a); });

  // 概览数字
  var classAvg = 0, topScore = -1, passCount = 0;
  STUDENTS.forEach(function (s) {
    classAvg += avgOf(s);
    if (totalOf(s) > topScore) topScore = totalOf(s);
    if (avgOf(s) >= 60) passCount++;
  });
  classAvg = classAvg / STUDENTS.length;
  var passRate = (passCount / STUDENTS.length * 100);

  function fix1(x) { return x.toFixed(1); }

  // ---------- 概览卡片 ----------
  var html = '<div class="cards">' +
    '<div class="card"><div class="label">学生人数</div><div class="value">' + STUDENTS.length + ' <small>人</small></div></div>' +
    '<div class="card"><div class="label">班级平均分</div><div class="value">' + fix1(classAvg) + '</div></div>' +
    '<div class="card"><div class="label">最高总分</div><div class="value">' + topScore + '</div></div>' +
    '<div class="card"><div class="label">及格率</div><div class="value">' + fix1(passRate) + '<small>%</small></div></div>' +
    '</div>';

  // ---------- 成绩明细表 ----------
  html += '<div class="panel"><h2>成绩明细（按平均分排序）</h2><table><thead><tr>' +
    '<th style="width:56px">名次</th><th>学号</th><th>姓名</th>';
  SUBJECTS.forEach(function (name) { html += '<th class="num">' + name + '</th>'; });
  html += '<th class="num">总分</th><th class="num">平均分</th></tr></thead><tbody>';

  ranked.forEach(function (s, i) {
    var cls = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
    html += '<tr><td><span class="rank-badge ' + cls + '">' + (i + 1) + '</span></td>' +
      '<td>' + s.id + '</td><td>' + s.name + '</td>';
    s.scores.forEach(function (v) { html += '<td class="num">' + v + '</td>'; });
    html += '<td class="num">' + totalOf(s) + '</td>' +
      '<td class="num">' + fix1(avgOf(s)) + '</td></tr>';
  });
  html += '</tbody></table></div>';

  // ---------- 平均分条形图 ----------
  html += '<div class="panel"><h2>平均分对比</h2>';
  var maxAvg = avgOf(ranked[0]);
  ranked.forEach(function (s) {
    var w = maxAvg > 0 ? (avgOf(s) / maxAvg * 100) : 0;
    html += '<div class="bar-row">' +
      '<div class="bar-name">' + s.name + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%">' + fix1(avgOf(s)) + '</div></div>' +
      '</div>';
  });
  html += '</div>';

  html += '<p class="footer">共 ' + STUDENTS.length + ' 名学生 · ' + N + ' 门科目</p>';

  box.innerHTML = html;
})();
</script>
</body>
</html>
